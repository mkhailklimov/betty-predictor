name = "betty-api"
main = "src/worker.js"
compatibility_date = "2024-12-01"

# Rollout switch for the initData auth fix (2026-07-14).
#   "1" — also accept the old `Bearer <tg_id>` header, so clients still running
#         the pre-fix bundle keep working while the new frontend propagates.
#   "0" — signed initData only. This is what actually closes the hole; flip it
#         once the new frontend is live and verified.
[vars]
ALLOW_LEGACY_AUTH = "1"

[[d1_databases]]
binding = "DB"
database_name = "betty-db"
database_id = "a064b461-a310-484e-80de-66a684e71c7c"

# Cron triggers (prod):
#   "0 * * * *"  — hourly: auto-update match is_active status (live/finished).
#   "0 6 * * FRI"  — Fridays 06:00 UTC: push users D1 → Google Sheets "Users" tab.
[triggers]
crons = ["0 * * * *", "0 6 * * FRI"]

# Dev environment — deploy with `wrangler deploy --env dev`.
# Uses the same D1 database for now (we can point to a dev D1 later if needed).
# Intentionally no crons in dev to avoid double-firing the weekly sync.
[env.dev]
name = "betty-api-dev"

[env.dev.vars]
ALLOW_LEGACY_AUTH = "1"

[env.dev.triggers]
crons = []

[[env.dev.d1_databases]]
binding = "DB"
database_name = "betty-db"
database_id = "a064b461-a310-484e-80de-66a684e71c7c"
