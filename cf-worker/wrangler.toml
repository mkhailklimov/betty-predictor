name = "betty-api"
main = "src/worker.js"
compatibility_date = "2024-12-01"

# Rollout switch for the initData auth fix (2026-07-14).
#   "1" — also accept the old `Bearer <tg_id>` header, so clients still running
#         the pre-fix bundle keep working while the new frontend propagates.
#   "0" — signed initData only. ACTIVE since 2026-07-14: the new frontend was
#         confirmed working in a real Telegram client, so the old header is refused.
[vars]
ALLOW_LEGACY_AUTH = "0"

[[d1_databases]]
binding = "DB"
database_name = "betty-db"
database_id = "a064b461-a310-484e-80de-66a684e71c7c"

# Cron triggers (prod):
#   "0 * * * *"  — hourly: auto-update match is_active status (live/finished).
#   "0 6 * * FRI"  — Fridays 06:00 UTC: push users D1 → Google Sheets "Users" tab.
[triggers]
crons = ["0 * * * *", "0 6 * * FRI"]

# Dev environment — deploy with `wrangler deploy --env dev`.
# Shares the production D1 **by decision** (2026-07-26): dev and prod are
# separated at the UI layer only. Betty has one source of truth and no large
# data volumes, so a second database is not worth its cost. Consequence: dev
# writes land in live tables, so v2 dev testing must be scoped to reserved,
# disposable keys (test week_ids, test identities) — see docs/RELEASE-2.0.md
# §4.4.3. Anything that can't be scoped that way is tested on a local
# `wrangler dev --local` SQLite instead, not here.
# Intentionally no crons in dev to avoid double-firing the weekly sync.
[env.dev]
name = "betty-api-dev"

[env.dev.vars]
ALLOW_LEGACY_AUTH = "0"

[env.dev.triggers]
crons = []

[[env.dev.d1_databases]]
binding = "DB"
database_name = "betty-db"
database_id = "a064b461-a310-484e-80de-66a684e71c7c"
